name: release

# Push a tag such as v0.1.0 to build a universal app and publish it as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac/JBLProtocol4
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      JBL_SIGN_IDENTITY: ${{ vars.JBL_SIGN_IDENTITY }}
      JBL_BUNDLE_ID: ${{ vars.JBL_BUNDLE_ID }}
      JBL_UNIVERSAL: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Version from tag
        run: echo "JBL_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Replay tests
        run: swift test
      - name: Import signing certificate (skipped without secrets)
        env:
          JBL_CERT_P12_BASE64: ${{ secrets.JBL_CERT_P12_BASE64 }}
          JBL_CERT_PASSWORD: ${{ secrets.JBL_CERT_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: Build DMG and zip
        run: |
          if [ -n "${JBL_KEYCHAIN:-}" ]; then make dmg zip; else ALLOW_UNSTABLE_SIGN=1 make dmg zip; fi
          cd build && shasum -a 256 JBLProtocol4-*.dmg JBLProtocol4-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        run: |
          files=(build/JBLProtocol4-"$JBL_VERSION".dmg build/JBLProtocol4-"$JBL_VERSION".zip build/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
            gh release create "$TAG" "${files[@]}" --title "JBL Protocol4 $TAG" --generate-notes --verify-tag ${pre[@]+"${pre[@]}"}
          fi
